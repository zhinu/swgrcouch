; >>> SWGRCouch network override >>>
; SWGRCouch network override (user Engine.ini layer). Needed on EVERY machine of a SWGRCouch network race (host and
; every client); harmless for offline split-screen. Source: notes/research/netcode.md sections 1, 6.1, 8, 9.
;
; WHERE: append this file to
;   <prefix>/drive_c/users/steamuser/AppData/Local/StarWarsGalacticRacer/Saved/Config/Windows/Engine.ini
; (create it if missing; it is the folder where GameUserSettings.ini appears). mod/install.sh --prefix <prefix> does it
; once (it checks for the IpNetDriver line), keeps a dated copy of the old file, and --net-off / --net-on comment the
; block out / back in between the two marker lines.
; VERIFY(V-NET-01): that folder is the active user layer under the game's SteamPlayFab custom config, and the game does
; not drop the block when it rewrites the file. Check in UE4SS.log in the first front end:
;   [SWGRCouch][net] GameNetDriver = /Script/OnlineSubsystemUtils.IpNetDriver: Engine.ini override active
; (otherwise the lobby shows "ENGINE.INI NET OVERRIDE NOT ACTIVE"; V-NET-02).
;
; WARNING: official online play (PlayFab Party matchmaking) DOES NOT WORK while this override is active.
; Use install.sh --net-off (or a second Wine prefix) to play official online again.
;
; PORT: the host listens on the engine's [URL] Port (7777). To use another port, start the HOST with -port=N
; (Steam launch options) and set Port = N in ue4ss/Mods/SWGRCouch/settings.txt on every machine. Over WireGuard, allow
; UDP N on the host's tunnel interface.
;
; Note: UE ini files only know whole-line comments (';'); never put a comment after a value.

; Plain UDP game traffic (direct IP / WireGuard) instead of PlayFab Party. PlayFab Party allows one user per device
; (MaxUsersPerDeviceCount=1), so split-screen guests (child connections) need IpNetDriver. The game defines
; GameNetDriver in THIS section with ClearArray (Windows/WindowsEngine.ini, Custom/SteamPlayFab/DefaultEngine.ini), so
; the override must be here: an override in [/Script/Engine.Engine] loses. DriverClassNameFallback only applies when the
; primary class fails to load, never when a connection fails. The game's own block already drops the base
; BeaconNetDriver/DemoNetDriver entries; this flow uses neither.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemUtils.IpNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

; 30 Hz server tick is the game's own value (DefaultEngine.ini); raise it only once races work (M6). The game's IP
; timeouts are 15 s / 20 s; race maps are large World Partition maps and a cold client load can exceed 20 s, hence
; 120 s for the initial connect and 30 s once connected.
[/Script/OnlineSubsystemUtils.IpNetDriver]
NetServerMaxTickRate=30
ConnectionTimeout=30.0
InitialConnectTimeout=120.0

; Iris: compiled in and allowed for GameNetDriver; whether the race game mode enables it is unknown statically.
; Client and server MUST use the same replication system. Start with the shipped setting. If client guests fail to
; join (JoinSplitFailure) or never replicate (VERIFY V-NET-03), turn Iris off on ALL machines, by ONE of:
;   - uncommenting the two lines below,
;   - the Steam launch option -UseIrisReplication=0,
;   - IrisOff = true in ue4ss/Mods/SWGRCouch/Scripts/config_user.lua (set at runtime before any net driver exists).
;[ConsoleVariables]
;net.Iris.UseIrisReplication=0

; Only if the host log shows "incompatible_unique_net_id" when a client joins (VERIFY V-NET-10): uncomment and put
; the unique net id type name printed in the host log. The game's list is Windows, GDK, PS5.
;[/Script/OnlineSubsystemUtils.OnlineEngineInterfaceImpl]
;+CompatibleUniqueNetIdTypes=<type name from the host log>

; Keep modded crashes from being uploaded: the game's Sentry config sends screenshots and logs (InitAutomatically=True,
; AttachScreenshot=True, EnableAutoLogAttachment=True in DefaultEngine.ini).
; VERIFY(V-NET-01): no Sentry upload line in the Proton log after a crash with this layer active.
[/Script/Sentry.SentrySettings]
InitAutomatically=False
; <<< SWGRCouch network override <<<
