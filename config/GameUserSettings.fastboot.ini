; >>> SWGRCouch fastboot (user GameUserSettings.ini layer) >>>
; Optional companion of Scripts/fastboot.lua (cfg.FastBootEpic = "off"). It keeps the game's own "EOS account linking"
; setting OFF, which is the state the game itself writes when you press ACCEPT on its
; "SOCIAL OVERLAY UNAVAILABLE ... EOS linking will be disabled" dialog.
;
; WHERE: the key below already exists in
;   <prefix>/drive_c/users/steamuser/AppData/Local/StarWarsGalacticRacer/Saved/Config/Windows/GameUserSettings.ini
; (Steam prefix: ~/.local/share/Steam/steamapps/compatdata/4078430/pfx). Do NOT append this file there: change the
; existing line in place (keep a dated copy first), or add the line under the existing section if it is missing:
;   bEnableEOSAccountLinking=True   ->   bEnableEOSAccountLinking=False
; The game rewrites this file on every settings save, so a whole second copy of the section is not kept.
;
; What it does and does not do (static analysis, see fastboot.lua header):
; - The Epic login gate (FrontEndGameMode::WantsEosLogin) reads the PROFILE flag UProfileMetaData.bUseEosLinking
;   stored in SaveGames/<SteamID>/GriffinSave.6.sav, not this ini key. This key is only the settings-menu mirror
;   (SetUseEosLinking copies the profile value into it). On its own it is NOT proven to stop the browser login;
;   fastboot.lua turns the profile flag off at runtime, and the game saves that like an ACCEPT.
; - To use Epic linking again: set FastBootEpic = "keep" in Scripts/config_user.lua, put this key back to True (or
;   turn the option on in the game's settings).
;
; UE ini files only know whole-line comments (';'); never put a comment after a value.
[/Script/Griffin.GfnUserSettingsPC]
bEnableEOSAccountLinking=False
; <<< SWGRCouch fastboot <<<
